[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inductive-mff"
version = "0.1.0"
description = "Inductive decision procedure for minimal factored forms over {AND, OR, NOT-on-literals}"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["inductive_mff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"